name: Finance OS database contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run disposable PostgreSQL contract checks
        id: database
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U postgres -d postgres -f tests/database_contracts.sql

      - name: Record machine-readable database QA evidence
        if: always()
        env:
          QA_STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 scripts/write_qa_evidence.py database "$RUNNER_TEMP/qa-database.json"
      - name: Upload database QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-database
          path: ${{ runner.temp }}/qa-database.json
          if-no-files-found: error
