name: Finance OS quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        cutover: ['0', '1']
    runs-on: ubuntu-24.04
    env:
      ICT_TERMINAL_CUTOVER: ${{ matrix.cutover }}
      SITE_URL: https://finance-intelligence-os-whizz444yt-7353.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runtime
        id: runtime
        run: |
          python3 --version
          node --version
      - name: Build static routes
        id: build
        run: python3 scripts/build_site.py
      - name: Unit tests
        id: python_tests
        run: python3 -m unittest discover -s tests -v
      - name: Node tests
        id: node_tests
        run: node --test tests/*.mjs
      - name: Verify release version consistency
        id: version
        run: |
          python3 - <<'PY'
          import json, re, pathlib, sys
          version = str(json.loads(pathlib.Path("package.json").read_text())["version"])
          parts = version.split(".")
          if len(parts) != 3 or any(not part.isdigit() for part in parts):
              sys.exit("package.json must contain a semantic version")
          checks = {
              "homepage release badge": f"v{version}" in pathlib.Path("index.html").read_text(),
              "service-worker cache": f"v{version}" in pathlib.Path("sw.js").read_text() and "CACHE_NAME = CACHE_PREFIX" in pathlib.Path("sw.js").read_text(),
          }
          for label, passed in checks.items():
              print(("PASS" if passed else "FAIL") + " " + label)
          if not all(checks.values()):
              sys.exit(1)
          PY
      - name: Structural and security validation
        id: structure
        run: python3 scripts/validate.py
      - name: Internal link and anchor audit
        id: links
        run: python3 scripts/audit_internal_links.py

      - name: Verify clean artifact reproducibility
        id: clean
        run: python3 scripts/check_clean_artifact.py
      - name: Check exact ICT watch URLs
        id: watch_urls
        run: python3 scripts/check_ict_watch_urls.py
      - name: Bundle Worker without deploying
        id: worker_bundle
        env:
          WRANGLER_SEND_METRICS: 'false'
        if: matrix.cutover == '0'
        run: |
          npm ci --no-audit --no-fund
          npm run worker:dry-run
      - name: Check responsive public pages in Chromium
        id: browser
        if: matrix.cutover == '0'
        run: |
          npm install --prefix "$RUNNER_TEMP/public-ui" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/public-ui/node_modules/.bin/playwright" install --with-deps chromium
          python3 scripts/serve_public_ui.py &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8798/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check_public_ui.mjs "$RUNNER_TEMP/public-ui" "$RUNNER_TEMP/public-ui-screenshots"
      - name: Archive desktop and phone screenshots
        if: always() && matrix.cutover == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-ui-screenshots
          path: ${{ runner.temp }}/public-ui-screenshots/

      - name: Compare clean standard and cutover route manifests
        id: parity
        if: matrix.cutover == '0'
        run: |
          cp dist/route-manifest.json "$RUNNER_TEMP/standard-routes.json"
          ICT_TERMINAL_CUTOVER=1 python3 scripts/build_site.py
          python3 scripts/check_release_parity.py "$RUNNER_TEMP/standard-routes.json" dist/route-manifest.json

      - name: Record machine-readable QA evidence
        if: always()
        env:
          QA_STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 scripts/write_qa_evidence.py quality "$RUNNER_TEMP/qa-evidence.json"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-evidence-cutover-${{ matrix.cutover }}
          path: ${{ runner.temp }}/qa-evidence.json
          if-no-files-found: error
